[package]
name = "lanlink"
version = "0.2.1"
description = "A small KDE Connect alternative: daemon and TUI in one binary"
license = "GPL-3.0-or-later"
repository = "https://github.com/adelmonte/lanlink"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
hostname = "0.4.2"
notify-rust = "4.19.0"
ratatui = "0.30.2"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
smithay-client-toolkit = { version = "0.21.1", default-features = false }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4"] }
x509-parser = "0.18.1"
zbus = "6.2.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
