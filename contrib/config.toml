# ~/.config/lanlink/config.toml - every line is optional.

# name = "tv-box"            # defaults to the hostname
# device_type = "desktop"    # desktop, laptop, tv, phone, tablet
# download_dir = "~/Downloads"
# mount_dir = "/run/user/1000/lanlink"   # phones mount at <mount_dir>/<name> ($XDG_RUNTIME_DIR/lanlink by default)

# pointer_speed = 1.0
# scroll_speed = 1.0         # wheel notches per received scroll event
# invert_scroll = false      # flip received scrolling
# natural_scroll = true      # two-finger direction when *you* control another device

# border_color = "#ff8800"   # frame shown while your input is captured
# border_width = 4

# tcp_port = 1716
# discovery = true
